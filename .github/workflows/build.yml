name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libsqlite3-dev pkg-config

      - name: Build
        run: gcc -o siem main.c log.c db.c $(pkg-config --cflags --libs gtk+-3.0 sqlite3) -Wall -Wextra -Werror

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: siem-binary
          path: siem
